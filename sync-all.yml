          curl -fsSL --retry 3 --retry-delay 2 https://api.github.com/repos/miloquinn/open-reading/releases/latest > release_8.json
          IPA_URL=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .browser_download_url][0] // empty' release_8.json)
