          IPA_URL=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .browser_download_url][0] // empty' release_9.json)
          IPA_SIZE=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .size][0] // empty' release_9.json)
