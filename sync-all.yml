name: Sync All Apps Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-all.yml'

permissions:
  contents: write

jobs:
  sync-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync PiliPlus
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://api.github.com/repos/bggRGjQaUbCoE/PiliPlus/releases/latest > release_0.json
          IPA_URL=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .browser_download_url][0] // empty' release_0.json)
          IPA_SIZE=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .size][0] // empty' release_0.json)
          TAG_NAME=$(jq -r '.tag_name // empty' release_0.json)
          PUBLISHED_AT=$(jq -r '.published_at // empty' release_0.json)
          BODY=$(jq -r '.body // ""' release_0.json)
          if [ -z "$IPA_URL" ] || [ -z "$IPA_SIZE" ] || [ -z "$TAG_NAME" ]; then echo "PiliPlus: 未找到 IPA 或版本信息"; exit 1; fi
          jq --arg v "$TAG_NAME" --arg d "$PUBLISHED_AT" --arg body "$BODY" --arg url "$IPA_URL" --argjson size "$IPA_SIZE"             '.apps[0].version=$v | .apps[0].versionDate=$d | .apps[0].versionDescription=$body | .apps[0].downloadURL=$url | .apps[0].size=$size | .apps[0].versions=[{"version":$v,"date":$d,"localizedDescription":$body,"downloadURL":$url,"size":$size}]'             apps.json > tmp.json && mv tmp.json apps.json
          echo "PiliPlus: $TAG_NAME / $IPA_SIZE bytes"
