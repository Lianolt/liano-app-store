          jq --arg v "$TAG_NAME" --arg d "$PUBLISHED_AT" --arg body "$BODY" --arg url "$IPA_URL" --argjson size "$IPA_SIZE"             '.apps[9].version=$v | .apps[9].versionDate=$d | .apps[9].versionDescription=$body | .apps[9].downloadURL=$url | .apps[9].size=$size | .apps[9].versions=[{"version":$v,"date":$d,"localizedDescription":$body,"downloadURL":$url,"size":$size}]'             apps.json > tmp.json && mv tmp.json apps.json
          echo "Pixiv-SwiftUI: $TAG_NAME / $IPA_SIZE bytes"
      - name: Validate apps.json
        run: |
          set -euo pipefail
          jq empty apps.json
          test "$(jq '[.apps[] | select(.developerName == "AREKERT" or .bundleIdentifier == "com.arekert.read")] | length' apps.json)" = "0"
          test "$(jq '.apps | length' apps.json)" = "10"
          if jq -e '[.apps[] | select(.size == 0 or .downloadURL == null or .version == null)] | length > 0' apps.json >/dev/null; then
            echo '存在尚未同步的应用元数据'; exit 1
          fi
          echo 'apps.json 校验通过。'

      - name: Commit and push changes
        run: |
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git add apps.json
          if git diff --staged --quiet; then
            echo '所有版本均无变化，无需提交。'
          else
            git commit -m "Auto-sync Liano's ipasource apps"
            git push
          fi
