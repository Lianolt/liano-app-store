          jq --arg v "$TAG_NAME" --arg d "$PUBLISHED_AT" --arg body "$BODY" --arg url "$IPA_URL" --argjson size "$IPA_SIZE"             '.apps[4].version=$v | .apps[4].versionDate=$d | .apps[4].versionDescription=$body | .apps[4].downloadURL=$url | .apps[4].size=$size | .apps[4].versions=[{"version":$v,"date":$d,"localizedDescription":$body,"downloadURL":$url,"size":$size}]'             apps.json > tmp.json && mv tmp.json apps.json
