          jq --arg v "$TAG_NAME" --arg d "$PUBLISHED_AT" --arg body "$BODY" --arg url "$IPA_URL" --argjson size "$IPA_SIZE"             '.apps[5].version=$v | .apps[5].versionDate=$d | .apps[5].versionDescription=$body | .apps[5].downloadURL=$url | .apps[5].size=$size | .apps[5].versions=[{"version":$v,"date":$d,"localizedDescription":$body,"downloadURL":$url,"size":$size}]'             apps.json > tmp.json && mv tmp.json apps.json
          echo "TiebaPure: $TAG_NAME / $IPA_SIZE bytes"
      - name: Sync Cilicili
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://api.github.com/repos/Rone89/cilicili/releases/latest > release_6.json
          IPA_URL=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .browser_download_url][0] // empty' release_6.json)
          IPA_SIZE=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .size][0] // empty' release_6.json)
          TAG_NAME=$(jq -r '.tag_name // empty' release_6.json)
          PUBLISHED_AT=$(jq -r '.published_at // empty' release_6.json)
          BODY=$(jq -r '.body // ""' release_6.json)
          if [ -z "$IPA_URL" ] || [ -z "$IPA_SIZE" ] || [ -z "$TAG_NAME" ]; then echo "Cilicili: 未找到 IPA 或版本信息"; exit 1; fi
          jq --arg v "$TAG_NAME" --arg d "$PUBLISHED_AT" --arg body "$BODY" --arg url "$IPA_URL" --argjson size "$IPA_SIZE"             '.apps[6].version=$v | .apps[6].versionDate=$d | .apps[6].versionDescription=$body | .apps[6].downloadURL=$url | .apps[6].size=$size | .apps[6].versions=[{"version":$v,"date":$d,"localizedDescription":$body,"downloadURL":$url,"size":$size}]'             apps.json > tmp.json && mv tmp.json apps.json
          echo "Cilicili: $TAG_NAME / $IPA_SIZE bytes"
      - name: Sync Melox
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://api.github.com/repos/youshen2/MeloX/releases/latest > release_7.json
          IPA_URL=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .browser_download_url][0] // empty' release_7.json)
          IPA_SIZE=$(jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".ipa")) | .size][0] // empty' release_7.json)
          TAG_NAME=$(jq -r '.tag_name // empty' release_7.json)
          PUBLISHED_AT=$(jq -r '.published_at // empty' release_7.json)
