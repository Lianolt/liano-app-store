          if [ -z "$IPA_URL" ] || [ -z "$IPA_SIZE" ] || [ -z "$TAG_NAME" ]; then echo "Open Reading: 未找到 IPA 或版本信息"; exit 1; fi
          jq --arg v "$TAG_NAME" --arg d "$PUBLISHED_AT" --arg body "$BODY" --arg url "$IPA_URL" --argjson size "$IPA_SIZE"             '.apps[8].version=$v | .apps[8].versionDate=$d | .apps[8].versionDescription=$body | .apps[8].downloadURL=$url | .apps[8].size=$size | .apps[8].versions=[{"version":$v,"date":$d,"localizedDescription":$body,"downloadURL":$url,"size":$size}]'             apps.json > tmp.json && mv tmp.json apps.json
          echo "Open Reading: $TAG_NAME / $IPA_SIZE bytes"
