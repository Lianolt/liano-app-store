name: Sync All Apps Updates

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-all.yml'
      - 'scripts/sync_additional_apps.py'

permissions:
  contents: write

jobs:
  sync-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync all apps from GitHub Releases (stable + prerelease)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_additional_apps.py

      - name: Validate apps.json
        run: |
          set -euo pipefail
          jq empty apps.json
          test "$(jq '[.apps[] | select(.developerName == "AREKERT" or .bundleIdentifier == "com.arekert.read")] | length' apps.json)" = "0"
          test "$(jq '.apps | length' apps.json)" -ge 10
          if jq -e '[.apps[] | select((.size | type) != "number" or .size <= 0 or (.downloadURL | type) != "string" or (.downloadURL | endswith(".ipa") | not) or (.version | type) != "string" or (.bundleIdentifier | type) != "string" or (.bundleIdentifier | length) == 0 or (.iconURL | type) != "string" or (.iconURL | length) == 0)] | length > 0' apps.json >/dev/null; then
            echo '存在缺少 IPA 下载地址、文件大小、版本、Bundle ID 或图标的应用元数据'; exit 1
          fi
          echo 'apps.json 校验通过。'

      - name: Commit and push changes
        run: |
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git add apps.json
          if git diff --staged --quiet; then
            echo '所有版本均无变化，无需提交。'
          else
            git commit -m "Auto-sync Liano's ipasource apps"
            git push
          fi
